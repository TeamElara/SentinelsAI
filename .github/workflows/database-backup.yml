name: Encrypted database backup

on:
  workflow_dispatch:
  schedule:
    # Sunday 03:17 UTC / 08:47 Asia/Kolkata. Avoid the busy hour boundary.
    - cron: '17 3 * * 0'

permissions:
  contents: read

concurrency:
  group: production-database-backup
  cancel-in-progress: false

jobs:
  backup:
    # Enable only after the protected environment, secrets and first restore
    # rehearsal are ready. No PR/feature branch may access production secrets.
    if: github.ref == 'refs/heads/main' && vars.SENTINELS_BACKUPS_ENABLED == 'true'
    environment: production-backups
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install reviewed production dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Export and verify encrypted snapshot
        working-directory: backend
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_BACKUP_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_BACKUP_AUTH_TOKEN }}
          SENTINELS_DB_DRIVER: libsql
          SENTINELS_BACKUP_KEY: ${{ secrets.SENTINELS_BACKUP_KEY }}
        run: python scripts/encrypted_database_backup.py export "$RUNNER_TEMP/sentinels-backup.sbk"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sentinels-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sentinels-backup.sbk
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
